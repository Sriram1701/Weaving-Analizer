<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="100%" height="100%">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E456E"/>
      <stop offset="100%" stop-color="#16324F"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19B077"/>
      <stop offset="100%" stop-color="#159765"/>
    </linearGradient>
    <filter id="shadowFull" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#16324F" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#FFFFFF" filter="url(#shadowFull)"/>
    <rect x="0" y="0" width="100" height="100" rx="22" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

    <g transform="translate(50, 50) rotate(45) scale(0.22) translate(-256, -256)">
      <!-- Vertical Thread 1 (Green) -->
      <rect x="180" y="112" width="56" height="288" rx="28" fill="url(#greenGrad)"/>
      <!-- Vertical Thread 2 (Green) -->
      <rect x="276" y="112" width="56" height="288" rx="28" fill="url(#greenGrad)"/>

      <!-- Horizontal Thread 1 (Navy) -->
      <rect x="112" y="180" width="288" height="56" rx="28" fill="url(#navyGrad)"/>
      <!-- Horizontal Thread 2 (Navy) -->
      <rect x="112" y="276" width="288" height="56" rx="28" fill="url(#navyGrad)"/>

      <!-- Weave Intersections -->
      <rect x="276" y="180" width="56" height="56" rx="14" fill="url(#greenGrad)"/>
      <rect x="180" y="276" width="56" height="56" rx="14" fill="url(#greenGrad)"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="128" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#16324F" letter-spacing="1">TEXTILE</text>
  <text x="128" y="78" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#159765" letter-spacing="0.5">WEAVING ANALYZER</text>
  
  <!-- Subtitle Tagline with decorative divider -->
  <circle cx="132" cy="98" r="3" fill="#159765"/>
  <line x1="142" y1="98" x2="160" y2="98" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <text x="168" y="102" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#667085" letter-spacing="0.2">Smart Costing. Accurate Weaving.</text>
</svg>
